# =============================================================
# RKA — Research Knowledge Agent
# One-click deployment: docker compose up -d
# =============================================================
#
# Prerequisites:
#   - Docker Desktop (macOS/Windows) or Docker Engine (Linux)
#
# Embeddings are ON by default in v2.4.0 with the FastEmbed backend
# (nomic-ai/nomic-embed-text-v1.5, 768-dim). Switch to LM Studio,
# Ollama, or any OpenAI-compatible HTTP backend at Settings → Embeddings
# in the web UI (config persists at /data/embedding_config.json,
# file-mode 0600).
#
# LLM-driven features (rka_ask, rka_generate_summary) are no longer
# configured here. The orchestrator's Claude Code SDK path handles LLM
# access (separate Phase-2 mission). The /api/llm/* REST routes + the
# rka_ask / rka_generate_summary MCP tools remain in the codebase as a
# graceful-no-op surface for future re-wiring.
#
# Usage:
#   docker compose up -d          # start
#   docker compose logs -f rka    # view logs
#   docker compose down           # stop
#
# Web UI:  http://localhost:9712
# API:     http://localhost:9712/docs
#
# Claude Desktop MCP config (~/.config/Claude/claude_desktop_config.json):
#   {
#     "mcpServers": {
#       "rka": {
#         "command": "docker",
#         "args": ["exec", "-i", "rka-server", "rka", "mcp"]
#       }
#     }
#   }
# =============================================================

services:
  rka:
    build: .
    container_name: rka-server
    ports:
      # Keep the unauthenticated local dashboard/API off the LAN. The server
      # still listens on all interfaces inside the container so Docker health
      # checks and the worker can reach it.
      - "127.0.0.1:9712:9712"
    volumes:
      # Keep server and worker on the same Docker named volume. Phase-2
      # sqlite-vec startup uses a sidecar file lock in /data; Docker Desktop host
      # bind mounts do not reliably propagate that lock across containers.
      - rka-data:/data
    environment:
      RKA_EMBEDDINGS_ENABLED: "true"
      # v2.5.4 (mis_01KRSP44W7BDZH11PZRGXH1WM4): context-engine weighted-sum
      # coefficients. Interpolated from shell env so eval-v2 sweep can swap
      # configs by setting these before `docker compose up -d --force-recreate`.
      # Defaults match the v2.5.3-hypothesis Config 1 in the sweep.
      RKA_CTX_W_IMP: "${RKA_CTX_W_IMP:-0.5}"
      RKA_CTX_W_CENT: "${RKA_CTX_W_CENT:-0.3}"
      # Phase-3.1 T5 cfg11 winner (mis_01KS3EB2671CDD4V9RZCMYCEH1; Brain
      # ratification of chk_01KS3K40N6JRHV118969RMBNF0): w_recency default
      # lowered 0.20 → 0.15.
      RKA_CTX_W_RECENCY: "${RKA_CTX_W_RECENCY:-0.15}"
      RKA_CTX_PI_LIFT: "${RKA_CTX_PI_LIFT:-0.125}"
      # Phase-3.1 T5 cfg11 winner: bundle_K default raised 50 → 80, the
      # Pareto-best point on the recall × efficiency frontier (hits the
      # structural recall ceiling 0.822 while preserving acceptable
      # ordering). Always-on post-rank-merge truncation introduced in T2;
      # T5 pins K at the sweep winner.
      RKA_CTX_BUNDLE_K: "${RKA_CTX_BUNDLE_K:-80}"
      # Phase-3.1 T5 cfg11 winner: recency-decay shape pinned at N=1 (the
      # simplest shape; the sweep showed N ∈ {1, 30, 90, 365} effects were
      # within noise, so backward-compat wins by tie-break). Operator
      # override via RKA_CTX_RECENCY_SHAPE_N preserved.
      RKA_CTX_RECENCY_SHAPE_N: "${RKA_CTX_RECENCY_SHAPE_N:-1}"
      # v2.7.0.1: bound onnxruntime threading + persist FastEmbed model
      # cache. Without these, onnxruntime spawns intra_op_num_threads ==
      # container CPU count and each thread allocates its own arena;
      # under load the worker OOM-loops (peak 7.87 GiB on a 9.21 GiB
      # ceiling, signature of unbounded growth). Cap is belt-and-suspenders:
      # OMP_NUM_THREADS is the env onnxruntime reads; RKA_EMBEDDING_THREADS
      # is the explicit kwarg passed to TextEmbedding(threads=...).
      # RKA_EMBEDDING_CACHE_DIR moves the ~130MB model cache onto the
      # rka-data volume so container recreate doesn't re-download (which
      # was hitting HF rate-limits during the OOM-restart loop).
      OMP_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
      RKA_EMBEDDING_THREADS: "${RKA_EMBEDDING_THREADS:-2}"
      RKA_EMBEDDING_CACHE_DIR: "/data/fastembed_cache"
      # Manuscript-workbench suggestions may use an LM Studio server on the
      # Docker host. The adapter accepts only loopback or this exact gateway;
      # it never falls back to a cloud provider.
      RKA_WORKBENCH_LM_STUDIO_BASE_URL: "${RKA_WORKBENCH_LM_STUDIO_BASE_URL:-http://host.docker.internal:1234/v1}"
      RKA_WORKBENCH_LM_STUDIO_MODEL: "${RKA_WORKBENCH_LM_STUDIO_MODEL:-}"
    # v2.7.0.1: bound container RAM. App-level thread cap should make this
    # never fire; if it does, container OOM-kills cleanly with
    # OOMKilled=true (proper signal) rather than the silent SIGKILL we
    # saw before. Override via env: RKA_SERVER_MEM_LIMIT=8g for fat
    # corpora that need more headroom.
    mem_limit: ${RKA_SERVER_MEM_LIMIT:-2g}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
  rka-worker:
    build: .
    container_name: rka-worker
    command: ["rka", "worker"]
    healthcheck:
      disable: true
    volumes:
      # Must match the server's lock-capable named volume (see above).
      - rka-data:/data
    environment:
      RKA_EMBEDDINGS_ENABLED: "true"
      RKA_JOB_SHUTDOWN_GRACE_SECONDS: "${RKA_JOB_SHUTDOWN_GRACE_SECONDS:-20}"
      # v2.5.4 (mis_01KRSP44W7BDZH11PZRGXH1WM4): context-engine weighted-sum
      # coefficients. Interpolated from shell env so eval-v2 sweep can swap
      # configs by setting these before `docker compose up -d --force-recreate`.
      # Defaults match the v2.5.3-hypothesis Config 1 in the sweep.
      RKA_CTX_W_IMP: "${RKA_CTX_W_IMP:-0.5}"
      RKA_CTX_W_CENT: "${RKA_CTX_W_CENT:-0.3}"
      # Phase-3.1 T5 cfg11 winner (mis_01KS3EB2671CDD4V9RZCMYCEH1; Brain
      # ratification of chk_01KS3K40N6JRHV118969RMBNF0): w_recency default
      # lowered 0.20 → 0.15.
      RKA_CTX_W_RECENCY: "${RKA_CTX_W_RECENCY:-0.15}"
      RKA_CTX_PI_LIFT: "${RKA_CTX_PI_LIFT:-0.125}"
      # Phase-3.1 T5 cfg11 winner: bundle_K default raised 50 → 80, the
      # Pareto-best point on the recall × efficiency frontier (hits the
      # structural recall ceiling 0.822 while preserving acceptable
      # ordering). Always-on post-rank-merge truncation introduced in T2;
      # T5 pins K at the sweep winner.
      RKA_CTX_BUNDLE_K: "${RKA_CTX_BUNDLE_K:-80}"
      # Phase-3.1 T5 cfg11 winner: recency-decay shape pinned at N=1 (the
      # simplest shape; the sweep showed N ∈ {1, 30, 90, 365} effects were
      # within noise, so backward-compat wins by tie-break). Operator
      # override via RKA_CTX_RECENCY_SHAPE_N preserved.
      RKA_CTX_RECENCY_SHAPE_N: "${RKA_CTX_RECENCY_SHAPE_N:-1}"
      # v2.7.0.1: see rka service above. The worker is the bigger memory
      # consumer (continuous embedding queue drain) so the cap matters
      # most here.
      OMP_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
      RKA_EMBEDDING_THREADS: "${RKA_EMBEDDING_THREADS:-2}"
      RKA_EMBEDDING_CACHE_DIR: "/data/fastembed_cache"
    # v2.7.0.1: bound container RAM. Override via RKA_WORKER_MEM_LIMIT=8g
    # for projects with large embedding queues.
    mem_limit: ${RKA_WORKER_MEM_LIMIT:-4g}
    # 20s in-flight drain, then leave time for lease/DB/provider cleanup.
    stop_grace_period: ${RKA_WORKER_STOP_GRACE_PERIOD:-30s}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - rka
    restart: unless-stopped

volumes:
  rka-data:
