[project]
name = "rka-core"
version = "3.0.1"
description = "Local-first research knowledge core with provenance-aware storage, retrieval, REST, and MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.26.0,<2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "aiosqlite>=0.22",
    "pydantic>=2.5",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "click>=8.1",
    "python-dotenv>=1.0",
    "python-ulid>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/rka-project/rka-core"
Repository = "https://github.com/rka-project/rka-core"
Issues = "https://github.com/rka-project/rka-core/issues"
Changelog = "https://github.com/rka-project/rka-core/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Core retrieval dependencies. Kept separate from legacy provider clients so
# the supported Core runtime never needs an LLM SDK.
embeddings = [
    "fastembed>=0.5",
    "sqlite-vec==0.1.6",
]
# Compatibility only: retained for frozen legacy Agentic/LLM contracts.
llm = [
    "litellm>=1.60",
    "instructor>=1.7",
]
academic = [
    "bibtexparser>=2.0.0b7",
    "habanero>=1.2",
    "semanticscholar>=0.11",
    "arxiv>=2.4",
]
workspace = [
    "pymupdf>=1.24",
    "python-docx>=1.1",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
rka = "rka.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rka*"]

[tool.setuptools.package-data]
# NOTE: Python's glob does not match dot-prefixed names with wildcards, so
# hidden files/dirs (.planning/, .latexmkrc, .mcp.json, .gitkeep) need explicit
# patterns. tests/test_skills_packaging.py enforces full coverage.
rka = [
    "db/*.sql",
    "db/migrations/*.sql",
    "skills/*.md",
    "skills/**/*.md",
    "skills/**/*.yaml",
    "skills/**/*.json",
    "skills/**/*.py",
    "skills/**/*.tex",
    "skills/**/*.bib",
    "skills/**/*.sh",
    "skills/**/.planning/*.md",
    "skills/**/.planning/*.yaml",
    "skills/**/.mcp.json",
    "skills/**/.latexmkrc",
    "skills/**/.gitkeep",
]

[tool.setuptools.exclude-package-data]
"*" = ["._*", "**/._*", ".DS_Store", "**/.DS_Store"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "writer: frozen Writer/Workbench compatibility tests excluded from the Core gate",
    "agentic: frozen Agentic/LLM-provider compatibility tests excluded from the Core gate",
]
