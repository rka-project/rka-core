name: Dependency security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-audit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned audit tools (not the application)
        run: python -m pip install "uv==0.9.17" "pip-audit==2.10.1"
      - name: Verify lock consistency
        run: uv lock --check
      - name: Export the supported Core runtime profile
        run: >-
          uv export --frozen --no-dev --no-emit-project --no-hashes
          --extra embeddings --extra academic --extra workspace
          --output-file audit-requirements.txt
      - name: Audit all locked runtime dependencies, including transitive dependencies
        run: >-
          python -m pip_audit --disable-pip --no-deps --progress-spinner off
          --requirement audit-requirements.txt
          --format json --output python-audit.json
      - name: Reject skipped packages and incomplete audit evidence
        run: python scripts/verify_dependency_audit.py python-audit.json
      - name: Preserve the audit evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-audit-${{ matrix.os }}-${{ matrix.python }}
          path: |
            python-audit.json
            audit-requirements.txt
          retention-days: 14

  frontend-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Audit the production dependency lock without running install scripts
        run: npm audit --package-lock-only --omit=dev --audit-level=low
