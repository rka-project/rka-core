name: pytest

# CI runs the independently selectable Core profile outside Docker against a
# fresh venv. Core installs embeddings, academic, and workspace support but no
# legacy LLM-provider SDKs. Frozen Writer/Workbench and Agentic compatibility
# tests remain in the repository under explicit ownership markers.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pytest-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check and build the production frontend
        run: npm run build

      - name: Test runtime search status presentation
        run: npm test

      - name: Preserve the dashboard bundle for Core startup smoke
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-web-dist
          path: web/dist
          retention-days: 1

  pytest:
    needs: web-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Core with runtime + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[embeddings,academic,workspace,dev]"

      - name: Restore the dashboard bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: core-web-dist
          path: web/dist

      - name: Verify the public REST and MCP contract snapshots
        run: python scripts/update_contract_snapshots.py

      - name: Run Core pytest profile
        run: >-
          python -m pytest -q --tb=short --strict-markers
          -m "not writer and not agentic"

      - name: Smoke-test Core startup surfaces
        run: python scripts/core_startup_smoke.py --require-web --require-vec

  historical-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install locked Core dependencies in an isolated environment
        run: |
          python -m pip install "uv==0.9.17"
          uv sync --locked --extra embeddings --extra academic --extra workspace --extra dev
      - name: Generate old-version synthetic databases and verify upgrade, pack and rollback
        env:
          RKA_DATA_DIR: ${{ runner.temp }}/rka-historical-data
          RKA_EMBEDDINGS_ENABLED: "false"
          RKA_LLM_ENABLED: "false"
          RKA_API_URL: http://127.0.0.1:1
          HF_HUB_OFFLINE: "1"
        run: uv run --no-sync python scripts/historical_upgrade_smoke.py --report-dir "${{ runner.temp }}/rka-upgrade-reports"
      - name: Preserve synthetic acceptance evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: historical-upgrade-report
          path: ${{ runner.temp }}/rka-upgrade-reports/*.json
          if-no-files-found: error
          retention-days: 30

  wheel-smoke:
    # Explicit bash enables -e/pipefail on every OS, including Git Bash on
    # Windows. PowerShell otherwise lets an earlier native-command failure
    # disappear behind the last successful command in a multi-command step.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    # The full Windows native/upgrade matrix exceeded 20 minutes on both the
    # release baseline and #164 while tests were still passing. Keep every
    # gate and a finite ceiling; other platforms retain their original budget.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 35 || 20 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Build the Core wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install and exercise only the built artifact outside the checkout
        run: python scripts/wheel_artifact_smoke.py

      - name: Install native-boundary and base-import test dependencies
        run: python -m pip install ".[dev,workspace]"

      - name: Verify local-only launch and credential defaults on this platform
        run: python -m pytest -q --tb=short --strict-markers tests/test_cli/test_local_release.py

      - name: Verify native file boundaries on this platform
        run: >-
          python -m pytest -q --tb=short --strict-markers
          tests/test_infra/test_file_access.py tests/test_api/test_file_access_boundary.py
          tests/test_cli/test_file_access_boundary.py

      - name: Verify imports and write round-trips without the academic extra
        env:
          RKA_DATA_DIR: ${{ runner.temp }}/rka-base-import-data
          RKA_EMBEDDINGS_ENABLED: "false"
          RKA_LLM_ENABLED: "false"
          RKA_API_URL: http://127.0.0.1:1
          HF_HUB_OFFLINE: "1"
        run: |
          python -c "import importlib.util; assert importlib.util.find_spec('bibtexparser') is None"
          python -m pytest -q --tb=short --strict-markers tests/test_services/test_bibtex_parser.py tests/test_services/test_bibtex_import.py tests/test_services/test_journal_write_path.py tests/test_mcp/test_import_roundtrip.py tests/test_mcp/test_write_field_roundtrip.py

      # setup-python's macOS Python lacks SQLite load_extension. Keep its base
      # wheel/import coverage above, then use a separate extension-capable
      # interpreter for real vector tests; never skip or mock sqlite-vec here.
      - name: Prepare extension-capable Python for macOS vector tests
        if: runner.os == 'macOS'
        env:
          RKA_TEST_PYTHON: ${{ matrix.python-version }}
          UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/rka-ci-python
          UV_CACHE_DIR: ${{ runner.temp }}/rka-ci-uv-cache
        run: |
          python -m pip install "uv==0.12.10"
          # Do not use `python -m uv`: that launcher pins its parent interpreter.
          RKA_UV_BIN="$(python -c 'from uv import find_uv_bin; print(find_uv_bin())')"
          "$RKA_UV_BIN" venv --managed-python --python "$RKA_TEST_PYTHON" --seed "$RUNNER_TEMP/rka-vector-venv"
          "$RUNNER_TEMP/rka-vector-venv/bin/python" -c "import sys, sqlite3; print(sys.executable, sys.version); assert hasattr(sqlite3.Connection, 'enable_load_extension'); assert hasattr(sqlite3.Connection, 'load_extension')"
          "$RUNNER_TEMP/rka-vector-venv/bin/python" -m pip install ".[dev,workspace]"
          echo "$RUNNER_TEMP/rka-vector-venv/bin" >> "$GITHUB_PATH"

      - name: Verify embedding admission without model downloads
        env:
          RKA_DATA_DIR: ${{ runner.temp }}/rka-embedding-resource-data
          RKA_EMBEDDINGS_ENABLED: "false"
          RKA_LLM_ENABLED: "false"
          RKA_API_URL: http://127.0.0.1:1
          HF_HUB_OFFLINE: "1"
        run: |
          python -c "import importlib.util; assert importlib.util.find_spec('fastembed') is None; assert importlib.util.find_spec('bibtexparser') is None"
          python -m pytest -q --tb=short --strict-markers tests/test_infra/test_embedding_resource_boundary.py tests/test_services/test_embedding_backends.py
          python -m pip install "sqlite-vec==0.1.6"
          python -c "import sqlite3, sqlite_vec; db = sqlite3.connect(':memory:'); db.enable_load_extension(True); sqlite_vec.load(db); db.enable_load_extension(False); print('Native sqlite-vec:', db.execute('SELECT vec_version()').fetchone()[0]); db.close()"
          python -m pytest -q --tb=short --strict-markers tests/test_services/test_embedding_resource_backfill.py tests/test_services/test_embedding_backfill.py
          python -m pytest -q --tb=short --strict-markers tests/test_services/test_embedding_documents.py tests/test_services/test_embedding_verification.py tests/test_services/test_embedding_index.py
          python -m pytest -q --tb=short --strict-markers tests/test_cli/test_embedding_inspect.py tests/test_infra/test_readonly_sqlite.py
          python -m pytest -q --tb=short --strict-markers tests/test_infra/test_runtime_lease.py tests/test_infra/test_native_embedding_process.py tests/test_services/test_embedding_recovery.py
          python -m pytest -q --tb=short --strict-markers tests/test_services/test_durable_embedding_backfill.py tests/test_api/test_durable_embedding_jobs.py tests/test_infra/test_database_transactions.py
          python -m pytest -q --tb=short --strict-markers tests/test_services/test_backfill_entrypoints.py tests/test_cli/test_backfill_durable.py tests/test_api/test_import_durable.py tests/test_api/test_import_progress.py

      - name: Verify journal attribution and capture on this platform
        env:
          RKA_DATA_DIR: ${{ runner.temp }}/rka-journal-i3-data
          RKA_EMBEDDINGS_ENABLED: "false"
          RKA_LLM_ENABLED: "false"
          RKA_API_URL: http://127.0.0.1:1
          HF_HUB_OFFLINE: "1"
        run: >-
          python -m pytest -q --tb=short --strict-markers
          tests/test_db/test_migration_056.py tests/test_db/test_migration_057.py
          tests/test_services/test_journal_update_audit.py
          tests/test_services/test_journal_attribution.py
          tests/test_services/test_journal_capture.py
          tests/test_services/test_knowledge_pack_journal_attribution.py
          tests/test_services/test_update_scope_guards.py
          tests/test_mcp/test_core_reliability_journal_roundtrip.py

      - name: Verify currentness, lifecycle, and portable integrity on this platform
        env:
          RKA_DATA_DIR: ${{ runner.temp }}/rka-i4-i7-data
          RKA_EMBEDDINGS_ENABLED: "false"
          RKA_LLM_ENABLED: "false"
          RKA_API_URL: http://127.0.0.1:1
          HF_HUB_OFFLINE: "1"
        run: >-
          python -m pytest -q --tb=short --strict-markers
          tests/test_db/test_migration_058_059.py
          tests/test_services/test_currentness_resolution.py
          tests/test_services/test_i_series_lifecycle.py
          tests/test_services/test_i_series_adversarial.py
          tests/test_services/test_pack_preflight.py
          tests/test_services/test_admin_repair.py
          tests/test_services/test_knowledge_pack.py

  docker-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the production Core image
        run: docker build -t rka-core:ci .

      - name: Verify the image dependency boundary
        run: >-
          docker run --rm rka-core:ci python -c
          "import importlib.util;
          found={name: importlib.util.find_spec(name) is not None
          for name in ('fastembed','sqlite_vec','litellm','instructor')};
          print(found);
          assert found == {'fastembed': True, 'sqlite_vec': True,
          'litellm': False, 'instructor': False}"

      - name: Smoke-test the isolated Core image
        run: >-
          python scripts/container_image_smoke.py
          --image rka-core:ci
          --expected-version 3.0.0

      - name: Verify offline recovery with the image's compiled sqlite-vec
        run: >-
          docker run --rm --network none --tmpfs /data:rw,noexec,nosuid,size=256m
          --mount type=bind,src=${{ github.workspace }}/scripts/embedding_container_recovery_smoke.py,dst=/tmp/recovery-smoke.py,readonly
          rka-core:ci python /tmp/recovery-smoke.py
